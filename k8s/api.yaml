apiVersion: apps/v1
kind: Deployment
metadata:
  name: insurance-api
  namespace: insurance

spec:
  replicas: 2

  selector:
    matchLabels:
      app: insurance-api

  template:
    metadata:
      labels:
        app: insurance-api

    spec:
      containers:
        - name: insurance-api
          image: insurance-policy-api-insurance-api:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: insurance-api-config
                  key: DB_URL

            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: insurance-api-config
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: insurance-api-secret
                  key: DB_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: insurance-api-secret
                  key: JWT_SECRET

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"

            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: insurance-api
  namespace: insurance

spec:
  selector:
    app: insurance-api

  ports:
    - port: 8080
      targetPort: 8080

  type: LoadBalancer